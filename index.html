      <h1>Vivek Parmar — Java Backend Engineer (Software Engineer L1)</h1>
      <p>Vivek Parmar is a Java Backend Engineer (Software Engineer L1) at Techforce Infotech Pvt. Ltd. in Ahmedabad, Gujarat, India. He builds and scales production Spring Boot applications, Kafka event streaming pipelines, and cloud infrastructure on AWS across enterprise healthcare and recruitment domains.</p>

      <h2>Core Architecture & Technical Stack</h2>
      <p>Vivek specializes in Java 17/21, Spring Boot, Apache Kafka event streaming, PostgreSQL/MySQL query tuning, Redis caching, and AWS cloud services (EC2, S3, Lambda, RDS). His focus is on measurable production engineering: eliminating N+1 database queries, implementing keyset pagination, distributed job locking with Quartz schedulers, stateless JWT authentication with role-based access control, and automating quality with JUnit, Mockito, and Playwright harnesses.</p>

      <h2>Professional Experience</h2>
      <ul>
        <li><strong>Software Engineer L1</strong> at Techforce Infotech Pvt. Ltd. (August 2024 – Present; promoted to Software Engineer L1 in January 2026): Engineering and maintaining enterprise healthcare order and patient management platforms and high-throughput recruitment search systems on AWS.</li>
        <li><strong>Software Development Intern</strong> at Rays TechServ (February 2024 – May 2024): Java, Spring Boot, and React.js web application engineering.</li>
        <li><strong>Web Development Intern</strong> at CodSoft (July 2023 – August 2023): Front-end web development with HTML5, CSS3, JavaScript, and React.js.</li>
      </ul>

      <h2>Featured Production Projects</h2>
      <ul>
        <li><strong>Enterprise Healthcare Order & Patient Management Platform</strong>: Designed and maintained 40+ REST APIs in Java 17 and Spring Boot serving 100+ organizations and 10,000+ orders. Built Kafka event streaming, Quartz-scheduled Stripe automation (-40% manual time), and 99.9% uptime on AWS.</li>
        <li><strong>KabilHire Recruitment Platform & ATS Query Optimization</strong>: Reworked candidate search pipeline in Java 21, Spring Boot 4, PostgreSQL, and Redis. Replaced N+1 lookups with batched JOIN FETCH, introduced keyset pagination, cutting API requests by 64% and network payload by 60% verified via Playwright.</li>
        <li><strong>Job Scraper Multi-Source Aggregator Engine</strong>: Built multi-source engine in under 4 weeks covering Indeed, LinkedIn, and Naukri with Playwright headless browsers, freshness gates, and 4-layer deduplication.</li>
        <li><strong>Skillroom — Prompt Intelligence Engine</strong>: Open-source Claude Agent Skill on GitHub (MIT) transforming brief prompts into structured, expert-level prompts with intent classification and a quality scorecard.</li>
        <li><strong>Lab Automation Tool</strong>: Lab testing digitization with Angular 17, PrimeNG, MySQL, and Spring Boot REST APIs.</li>
      </ul>
