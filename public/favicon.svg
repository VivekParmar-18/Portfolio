<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="coralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7350" />
      <stop offset="60%" stop-color="#ff4c24" />
      <stop offset="100%" stop-color="#d93510" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #0a0a0a; }
      .ring { stroke: rgba(255, 255, 255, 0.12); }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #050505; }
      .ring { stroke: rgba(255, 255, 255, 0.08); }
    }
  </style>
  <!-- Dark Editorial Container -->
  <rect class="bg" width="64" height="64" rx="16" fill="#050505" />
  <rect class="ring" x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Subtle Monospace Matrix Grid Marks -->
  <circle cx="16" cy="16" r="1.5" fill="#252525" />
  <circle cx="48" cy="16" r="1.5" fill="#252525" />
  <circle cx="16" cy="48" r="1.5" fill="#252525" />
  <circle cx="48" cy="48" r="1.5" fill="#252525" />

  <!-- Signature Glowing Coral Dot -->
  <circle cx="32" cy="32" r="13" fill="url(#coralGlow)" filter="url(#glow)" />
  
  <!-- Sleek Editorial Inner Dot Accent -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" opacity="0.95" />
</svg>
